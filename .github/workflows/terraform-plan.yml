name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select the branch to run Terraform plan against"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod
          - main
        default: prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.branch }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ inputs.branch }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.branch }}

    steps:

      # ---------------------------------------------------------
      # Checkout selected branch
      # ---------------------------------------------------------
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ---------------------------------------------------------
      # Set Terraform variables
      # ---------------------------------------------------------
      - name: Set Terraform variables
        shell: bash
        run: |
          set -e

          echo "TF_VAR_environment=${{ inputs.branch }}" >> "$GITHUB_ENV"

          echo "Terraform environment: ${{ inputs.branch }}"

      # ---------------------------------------------------------
      # Select AWS region based on environment
      # ---------------------------------------------------------
      - name: Set AWS region
        shell: bash
        run: |
          set -e

          case "${{ inputs.branch }}" in
            dev)
              echo "AWS_REGION=eu-west-1" >> "$GITHUB_ENV"
              ;;

            pre)
              echo "AWS_REGION=us-east-2" >> "$GITHUB_ENV"
              ;;

            prod)
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;

            main)
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown branch: ${{ inputs.branch }}"
              exit 1
              ;;
          esac

          echo "Selected environment: ${{ inputs.branch }}"

      # ---------------------------------------------------------
      # Show selected configuration
      # ---------------------------------------------------------
      - name: Verify selected environment
        run: |
          echo "Branch: ${{ inputs.branch }}"
          echo "Terraform Environment: $TF_VAR_environment"
          echo "GitHub Environment: ${{ inputs.branch }}"
          echo "AWS Region: $AWS_REGION"

      # ---------------------------------------------------------
      # Setup Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ---------------------------------------------------------
      # DEBUG ONLY
      # Decode OIDC claims without exposing the JWT
      # ---------------------------------------------------------
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token."
            exit 1
          fi

          echo "GitHub OIDC claims:"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" \
            | base64 -d 2>/dev/null \
            | jq '{
                iss,
                aud,
                sub,
                repository,
                repository_owner,
                ref,
                environment
              }'

      # ---------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666729139368:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-${{ inputs.branch }}

      # ---------------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "AWS Identity:"
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # Terraform Format Check
      # ---------------------------------------------------------
      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -upgrade

      # ---------------------------------------------------------
      # Select Terraform workspace
      # ---------------------------------------------------------
      - name: Select Terraform workspace
        shell: bash
        run: |
          set -e

          WORKSPACE="${{ inputs.branch }}"

          echo "Target Terraform workspace: $WORKSPACE"

          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$WORKSPACE"; then
            terraform workspace select "$WORKSPACE"
          else
            terraform workspace new "$WORKSPACE"
          fi

          echo "Current Terraform workspace:"
          terraform workspace show   

      # ---------------------------------------------------------
      # Terraform Validate
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: |
          terraform validate

      # ---------------------------------------------------------
      # Terraform Plan
      # ---------------------------------------------------------
      - name: Terraform Plan
        id: terraform-plan
        shell: bash
        run: |
          set -o pipefail

          WORKSPACE="${{ inputs.branch }}"

          echo "Terraform workspace: $(terraform workspace show)"
          echo "Branch: $WORKSPACE"

          if [ "$WORKSPACE" = "main" ]; then
            echo "Using common variables only: terraform.tfvars"

            terraform plan \
              -var-file="terraform.tfvars" \
              -out=plan.out \
              -input=false \
              -no-color \
              2>&1 | tee plan-output.txt
          else
            ENV_FILE="${WORKSPACE}.tfvars"

            echo "Using common variables: terraform.tfvars"
            echo "Using environment variables: $ENV_FILE"

            terraform plan \
              -var-file="terraform.tfvars" \
              -var-file="$ENV_FILE" \
              -out=plan.out \
              -input=false \
              -no-color \
              2>&1 | tee plan-output.txt
          fi

      # ---------------------------------------------------------
      # Convert Terraform plan to readable format
      # ---------------------------------------------------------
      - name: Convert plan to readable format
        if: always()
        run: |
          if [ -f plan.out ]; then
            terraform show \
              -no-color \
              plan.out > plan.txt

          elif [ -f plan-output.txt ]; then
            cp plan-output.txt plan.txt

          else
            echo "Terraform plan output was not generated." > plan.txt
          fi

      # ---------------------------------------------------------
      # GitHub Actions Summary
      # ---------------------------------------------------------
      - name: Add Terraform summary
        if: always()
        run: |
          {
            echo "## Terraform Plan"
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo "**Branch:** \`${{ inputs.branch }}\`"
            echo "**Environment:** \`${TF_VAR_environment}\`"
            echo "**AWS Region:** \`${AWS_REGION}\`"
            echo "**Commit:** \`$(git rev-parse HEAD)\`"
            echo ""
            echo "### Plan Output"
            echo ""
            echo '```text'

            if [ -f plan.txt ]; then
              head -c 60000 plan.txt
            fi

            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------
      # Upload Terraform plan artifact
      # ---------------------------------------------------------
      - name: Upload Terraform plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.branch }}-${{ github.run_id }}
          path: |
            plan.out
            plan.txt
            plan-output.txt
          if-no-files-found: warn
          retention-days: 7

      # ---------------------------------------------------------
      # Slack notification
      # ---------------------------------------------------------
      - name: Send Terraform plan to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PLAN_URL }}
          PLAN_OUTCOME: ${{ steps.terraform-plan.outcome }}
          SELECTED_BRANCH: ${{ inputs.branch }}
          SELECTED_REGION: ${{ env.AWS_REGION }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["SLACK_WEBHOOK_URL"]
          outcome = os.environ["PLAN_OUTCOME"]
          branch = os.environ["SELECTED_BRANCH"]
          region = os.environ["SELECTED_REGION"]
          run_url = os.environ["RUN_URL"]
          repository = os.environ["REPOSITORY"]
          commit_sha = os.environ["COMMIT_SHA"][:7]

          try:
              with open("plan.txt", "r", encoding="utf-8") as file:
                  plan = file.read()
          except FileNotFoundError:
              plan = "Terraform plan output was not generated."

          if outcome == "success":
              emoji = "✅"
              title = "Terraform Plan Succeeded"
          else:
              emoji = "❌"
              title = "Terraform Plan Failed"

          max_length = 22000

          if len(plan) > max_length:
              plan = (
                  plan[:max_length]
                  + "\n\n..."
                  + "\n\nPlan output truncated in Slack."
                  + "\nDownload the complete plan from GitHub Actions."
              )

          payload = {
              "text": f"{emoji} {title} - {repository} - {branch}",

              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": f"{emoji} {title}"
                      }
                  },

                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Repository:*\n`{repository}`"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Branch:*\n`{branch}`"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*AWS Region:*\n`{region}`"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Commit:*\n`{commit_sha}`"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Workflow:*\n<{run_url}|View workflow>"
                          }
                      ]
                  },

                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Terraform Plan Output:*"
                      }
                  },

                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"```{plan}```"
                      }
                  },

                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": (
                              "📦 The complete `plan.out`, `plan.txt`, "
                              "and raw plan output are available in the "
                              f"<{run_url}|GitHub Actions artifact>."
                          )
                      }
                  }
              ]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              response_body = response.read().decode("utf-8")

              if response.status < 200 or response.status >= 300:
                  raise RuntimeError(
                      f"Slack webhook failed: HTTP {response.status} - "
                      f"{response_body}"
                  )

          print("Slack notification sent successfully.")
          PY