name: Terraform State Refresh

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Environment to refresh"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod
        

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state-refresh-${{ inputs.branch }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VERSION: "1.9.8"

jobs:
  approval:
    name: Approval
    runs-on: ubuntu-latest
    environment: ${{ inputs.branch }}

    steps:
      - name: Approval confirmed
        run: |
          echo "State refresh approved for: ${{ inputs.branch }}"

  refresh-state:
    name: Refresh Terraform State
    needs: approval
    runs-on: ubuntu-latest

    environment: ${{ inputs.branch }}

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ---------------------------------------------------------
      # Determine environment
      # ---------------------------------------------------------
      - name: Set environment variables
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="${{ inputs.branch }}"

          case "$WORKSPACE" in
            dev)
              AWS_REGION="eu-west-1"
              ;;
            pre)
              AWS_REGION="us-east-2"
              ;;
            prod)
              AWS_REGION="us-east-1"
              ;;
            *)
              echo "ERROR: Unsupported environment: $WORKSPACE"
              exit 1
              ;;
          esac

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=$WORKSPACE" >> "$GITHUB_ENV"

          echo "Environment : $WORKSPACE"
          echo "AWS Region  : $AWS_REGION"

      # ---------------------------------------------------------
      # Verify variable files
      # ---------------------------------------------------------
      - name: Verify Terraform variable files
        shell: bash
        run: |
          set -euo pipefail

          ENV_FILE="environments/${WORKSPACE}.tfvars"

          echo "Checking Terraform variable files..."

          test -f terraform.tfvars || {
            echo "ERROR: terraform.tfvars not found"
            exit 1
          }

          test -f "$ENV_FILE" || {
            echo "ERROR: $ENV_FILE not found"
            exit 1
          }

          echo "Found:"
          echo "  terraform.tfvars"
          echo "  $ENV_FILE"

      # ---------------------------------------------------------
      # Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ---------------------------------------------------------
      # AWS OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666729139368:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-StateRefresh

      # ---------------------------------------------------------
      # Verify AWS
      # ---------------------------------------------------------
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      # ---------------------------------------------------------
      # MongoDB Atlas credentials
      # ---------------------------------------------------------
      - name: Configure MongoDB Atlas credentials
        shell: bash
        env:
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$MONGODB_ATLAS_PUBLIC_KEY" ]; then
            echo "ERROR: MONGODB_ATLAS_PUBLIC_KEY is not configured"
            exit 1
          fi

          if [ -z "$MONGODB_ATLAS_PRIVATE_KEY" ]; then
            echo "ERROR: MONGODB_ATLAS_PRIVATE_KEY is not configured"
            exit 1
          fi

          echo "TF_VAR_mongodb_atlas_public_key=$MONGODB_ATLAS_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_mongodb_atlas_private_key=$MONGODB_ATLAS_PRIVATE_KEY" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -upgrade

      - name: Diagnose Terraform backend and state
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Terraform Version"
          echo "============================================================"
          terraform version

          echo
          echo "============================================================"
          echo "Current Workspace"
          echo "============================================================"
          terraform workspace show

          echo
          echo "============================================================"
          echo "Available Workspaces"
          echo "============================================================"
          terraform workspace list

          echo
          echo "============================================================"
          echo "Terraform State List"
          echo "============================================================"
          terraform state list || true

          echo
          echo "============================================================"
          echo "Terraform State Pull Metadata"
          echo "============================================================"

          terraform state pull > /tmp/current-state.json

          jq '{
            version,
            terraform_version,
            serial,
            lineage,
            resource_count: (.resources | length),
            check_results_count: (.check_results // [] | length)
          }' /tmp/current-state.json

      
      # ---------------------------------------------------------
      # Select Terraform workspace
      # ---------------------------------------------------------
      - name: Select Terraform workspace
        shell: bash
        run: |
          set -e

          WORKSPACE="${{ inputs.branch }}"

          echo "Target Terraform workspace: $WORKSPACE"

          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$WORKSPACE"; then
            terraform workspace select "$WORKSPACE"
          else
            terraform workspace new "$WORKSPACE"
          fi

          echo "Current Terraform workspace:"
          terraform workspace show

      - name: Diagnose Terraform State
        shell: bash
        run: |
         set -euo pipefail

         echo "=========================================="
         echo "WORKSPACE"
         echo "=========================================="
         terraform workspace show

         echo
         echo "=========================================="
         echo "BACKEND CONFIGURATION"
         echo "=========================================="
         terraform state pull > current-state.json

         python - <<'PY'
         import json

         with open("current-state.json") as f:
             state = json.load(f)

         print("Terraform version :", state.get("terraform_version"))
         print("Serial            :", state.get("serial"))
         print("Lineage           :", state.get("lineage"))
         print("Resources         :", len(state.get("resources", [])))

         print("\nResources:")
         for resource in state.get("resources", []):
             print(
                 f"- {resource.get('module', '')}"
                 f"{resource.get('type')}.{resource.get('name')}"
             )
         PY

         echo
         echo "=========================================="
         echo "TERRAFORM WORKSPACES"
         echo "=========================================="
         terraform workspace list

      # ---------------------------------------------------------
      # Capture state BEFORE refresh
      # ---------------------------------------------------------
      - name: Capture state before refresh
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p state-backup

          echo "Pulling current state..."

          terraform state pull > state-backup/state-before.json

          echo "Listing current resources..."

          terraform state list > state-backup/resources-before.txt || true

          echo
          echo "State metadata BEFORE refresh:"

          jq '{
            terraform_version,
            serial,
            lineage,
            resource_count: (.resources | length),
            check_results_count: (.check_results // [] | length)
          }' state-backup/state-before.json

      # ---------------------------------------------------------
      # SAFETY CHECK
      # ---------------------------------------------------------
      - name: Validate current state
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_COUNT=$(jq '.resources | length' state-backup/state-before.json)

          echo "Resources currently recorded in state: $RESOURCE_COUNT"

          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo
            echo "============================================================"
            echo "WARNING: Terraform state contains ZERO resources."
            echo "============================================================"
            echo
            echo "The workflow will NOT continue."
            echo
            echo "This usually means one of the following:"
            echo "  - wrong backend"
            echo "  - wrong workspace"
            echo "  - empty/new state"
            echo "  - state was previously lost"
            echo
            echo "No state modification has been performed."
            exit 1
          fi

      # ---------------------------------------------------------
      # DIRECT STATE REFRESH
      #
      # IMPORTANT:
      # This does NOT create a Terraform plan.
      # This does NOT create a plan file.
      # This does NOT run terraform apply.
      #
      # terraform refresh reads the real infrastructure and
      # writes the refreshed state directly.
      # ---------------------------------------------------------
      - name: Refresh Terraform state
        shell: bash
        run: |
          set -euo pipefail

          ENV_FILE="environments/${WORKSPACE}.tfvars"

          echo "============================================================"
          echo "Refreshing Terraform state"
          echo "============================================================"
          echo
          echo "Workspace : $WORKSPACE"
          echo "AWS Region: $AWS_REGION"
          echo "Env file  : $ENV_FILE"
          echo
          echo "NO PLAN WILL BE CREATED."
          echo "NO terraform apply WILL BE EXECUTED."
          echo

          terraform refresh \
            -input=false \
            -var-file="terraform.tfvars" \
            -var-file="$ENV_FILE"

      # ---------------------------------------------------------
      # Capture state AFTER refresh
      # ---------------------------------------------------------
      - name: Capture state after refresh
        shell: bash
        run: |
          set -euo pipefail

          echo "Pulling refreshed state..."

          terraform state pull > state-backup/state-after.json

          echo "Listing refreshed resources..."

          terraform state list > state-backup/resources-after.txt || true

          echo
          echo "State metadata AFTER refresh:"

          jq '{
            terraform_version,
            serial,
            lineage,
            resource_count: (.resources | length),
            check_results_count: (.check_results // [] | length)
          }' state-backup/state-after.json

      # ---------------------------------------------------------
      # Compare resources
      # ---------------------------------------------------------
      - name: Compare state resources
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "State resource comparison"
          echo "============================================================"

          echo
          echo "Resources BEFORE:"
          cat state-backup/resources-before.txt || true

          echo
          echo "Resources AFTER:"
          cat state-backup/resources-after.txt || true

          echo
          echo "Checking for resource changes..."

          if diff -u \
            state-backup/resources-before.txt \
            state-backup/resources-after.txt; then

            echo
            echo "Resource addresses are unchanged."

          else

            echo
            echo "WARNING: Resource addresses changed during refresh."
            echo "Review the uploaded state artifact carefully."

          fi

      # ---------------------------------------------------------
      # State metadata summary
      # ---------------------------------------------------------
      - name: Generate state summary
        shell: bash
        run: |
          set -euo pipefail

          BEFORE_RESOURCES=$(jq '.resources | length' state-backup/state-before.json)
          AFTER_RESOURCES=$(jq '.resources | length' state-backup/state-after.json)

          BEFORE_CHECKS=$(jq '(.check_results // []) | length' state-backup/state-before.json)
          AFTER_CHECKS=$(jq '(.check_results // []) | length' state-backup/state-after.json)

          BEFORE_SERIAL=$(jq '.serial' state-backup/state-before.json)
          AFTER_SERIAL=$(jq '.serial' state-backup/state-after.json)

          BEFORE_TF=$(jq -r '.terraform_version' state-backup/state-before.json)
          AFTER_TF=$(jq -r '.terraform_version' state-backup/state-after.json)

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Terraform State Refresh

          | Property | Before | After |
          |---|---:|---:|
          | Workspace | \`${WORKSPACE}\` | \`${WORKSPACE}\` |
          | AWS Region | \`${AWS_REGION}\` | \`${AWS_REGION}\` |
          | Terraform version | \`${BEFORE_TF}\` | \`${AFTER_TF}\` |
          | State serial | \`${BEFORE_SERIAL}\` | \`${AFTER_SERIAL}\` |
          | Resources | \`${BEFORE_RESOURCES}\` | \`${AFTER_RESOURCES}\` |
          | Check results | \`${BEFORE_CHECKS}\` | \`${AFTER_CHECKS}\` |

          ### Operation

          This workflow performed a **direct Terraform state refresh**.

          - No Terraform plan was created.
          - No plan file was created.
          - No \`terraform apply\` was executed.
          - No resources were intentionally created or destroyed.
          EOF

      # ---------------------------------------------------------
      # Upload state diagnostics
      # ---------------------------------------------------------
      - name: Upload state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-refresh-${{ inputs.branch }}-${{ github.run_id }}
          path: state-backup/
          retention-days: 7
          if-no-files-found: warn

      # ---------------------------------------------------------
      # Final status
      # ---------------------------------------------------------
      - name: Refresh completed
        shell: bash
        run: |
          echo "============================================================"
          echo "Terraform state refresh completed."
          echo "============================================================"
          echo
          echo "Workspace : $WORKSPACE"
          echo "Region    : $AWS_REGION"
          echo
          echo "No Terraform plan was created."
          echo "No terraform apply was executed."

