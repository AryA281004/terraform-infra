name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select the branch to apply"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod
          - main
        default: prod

      plan_run_id:
        description: "GitHub Actions run ID of the Terraform Plan workflow"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.branch }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  # ============================================================
  # APPROVAL
  # ============================================================

  approval:
    name: Approval - ${{ inputs.branch }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.branch }}

    steps:

      - name: Approval granted
        run: |
          echo "Terraform apply approved."
          echo "Branch: ${{ inputs.branch }}"
          echo "Plan Run ID: ${{ inputs.plan_run_id }}"

  # ============================================================
  # TERRAFORM APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Apply - ${{ inputs.branch }}
    needs: approval
    runs-on: ubuntu-latest

    environment: ${{ inputs.branch }}

    steps:

      # ----------------------------------------------------------
      # Checkout selected branch
      # ----------------------------------------------------------

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ----------------------------------------------------------
      # Set Terraform variables
      # ----------------------------------------------------------

      - name: Set Terraform variables
        shell: bash
        run: |
          set -e

          echo "TF_VAR_environment=${{ inputs.branch }}" >> "$GITHUB_ENV"

          echo "Terraform environment: ${{ inputs.branch }}"

      # ----------------------------------------------------------
      # Select AWS region based on environment
      # ----------------------------------------------------------

      - name: Set AWS region
        shell: bash
        run: |
          set -e

          case "${{ inputs.branch }}" in
            dev)
              echo "AWS_REGION=eu-west-1" >> "$GITHUB_ENV"
              ;;

            pre)
              echo "AWS_REGION=us-east-2" >> "$GITHUB_ENV"
              ;;

            prod)
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;

            main)
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown branch: ${{ inputs.branch }}"
              exit 1
              ;;
          esac

          echo "Selected environment: ${{ inputs.branch }}"

      # ----------------------------------------------------------
      # Show selected configuration
      # ----------------------------------------------------------

      - name: Verify selected environment
        run: |
          echo "Branch: ${{ inputs.branch }}"
          echo "Terraform Environment: $TF_VAR_environment"
          echo "GitHub Environment: ${{ inputs.branch }}"
          echo "AWS Region: $AWS_REGION"
          echo "Plan Run ID: ${{ inputs.plan_run_id }}"

      # ----------------------------------------------------------
      # Setup Terraform
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ----------------------------------------------------------
      # DEBUG ONLY
      # Decode OIDC claims without exposing the JWT
      # ----------------------------------------------------------

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token."
            exit 1
          fi

          echo "GitHub OIDC claims:"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" \
            | base64 -d 2>/dev/null \
            | jq '{
                iss,
                aud,
                sub,
                repository,
                repository_owner,
                ref,
                environment
              }'

      # ----------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666729139368:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Apply-${{ inputs.branch }}

      # ----------------------------------------------------------
      # Verify AWS identity
      # ----------------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "AWS Identity:"
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Terraform Format Check
      # ----------------------------------------------------------

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -upgrade

      # ----------------------------------------------------------
      # Select Terraform workspace
      # ----------------------------------------------------------

      - name: Select Terraform workspace
        shell: bash
        run: |
          set -e

          WORKSPACE="${{ inputs.branch }}"

          echo "Target Terraform workspace: $WORKSPACE"

          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$WORKSPACE"; then
            terraform workspace select "$WORKSPACE"
          else
            terraform workspace new "$WORKSPACE"
          fi

          echo "Current Terraform workspace:"
          terraform workspace show

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        run: |
          terraform validate

      # ----------------------------------------------------------
      # Passing Mongo Atlas public/private key to Terraform
      # ----------------------------------------------------------

      - name: Set MongoDB Atlas Terraform variables
        shell: bash
        env:
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        run: |
          set -e

          echo "TF_VAR_mongodb_atlas_public_key=$MONGODB_ATLAS_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_mongodb_atlas_private_key=$MONGODB_ATLAS_PRIVATE_KEY" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Download exact Terraform plan artifact
      # ----------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.branch }}-${{ inputs.plan_run_id }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      # ----------------------------------------------------------
      # Verify Terraform plan files
      # ----------------------------------------------------------

      - name: Verify Terraform plan
        shell: bash
        run: |
          set -e

          echo "Downloaded Terraform plan artifact:"
          ls -lah

          if [ ! -f plan.out ]; then
            echo "ERROR: plan.out was not found."
            echo "The selected Plan workflow did not produce a valid plan artifact."
            exit 1
          fi

          echo ""
          echo "Terraform plan found:"
          ls -lh plan.out

          if [ -f plan.txt ]; then
            echo "Readable plan found:"
            ls -lh plan.txt
          fi

          if [ -f plan-output.txt ]; then
            echo "Terraform plan output found:"
            ls -lh plan-output.txt
          fi

      # ----------------------------------------------------------
      # Show Terraform plan before apply
      # ----------------------------------------------------------

      - name: Show Terraform plan
        shell: bash
        run: |
          set -e

          terraform show \
            -no-color \
            plan.out > plan.txt

          cat plan.txt

      # ----------------------------------------------------------
      # GitHub Actions Summary
      # ----------------------------------------------------------

      - name: Add Terraform apply summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Terraform Apply"
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo "**Branch:** \`${{ inputs.branch }}\`"
            echo "**Environment:** \`${TF_VAR_environment}\`"
            echo "**AWS Region:** \`${AWS_REGION}\`"
            echo "**Commit:** \`$(git rev-parse HEAD)\`"
            echo "**Plan Run ID:** \`${{ inputs.plan_run_id }}\`"
            echo "**Terraform Workspace:** \`$(terraform workspace show 2>/dev/null || echo unknown)\`"
            echo ""
            echo "### Terraform Plan"
            echo ""
            echo '```text'

            if [ -f plan.txt ]; then
              head -c 60000 plan.txt
            else
              echo "Terraform plan output was not available."
            fi

            echo ""
            echo '```'
            echo ""
            echo "### Apply Status"
            echo ""

            if [ "${{ steps.terraform-apply.outcome }}" = "success" ]; then
              echo "✅ Terraform apply completed successfully."
            else
              echo "❌ Terraform apply failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------
      # Apply exact approved Terraform plan
      # ----------------------------------------------------------

      - name: Terraform Apply
        id: terraform-apply
        shell: bash
        run: |
          set -e

          echo "Terraform workspace: $(terraform workspace show)"
          echo "Branch: ${{ inputs.branch }}"
          echo "AWS Region: $AWS_REGION"
          echo "Plan Run ID: ${{ inputs.plan_run_id }}"

          echo ""
          echo "Applying exact approved Terraform plan..."
          echo ""

          terraform apply \
            -input=false \
            -auto-approve \
            plan.out

     
      - name: Discover and validate frontend resources
        id: frontend-resources
        if: ${{ steps.terraform-apply.outcome == 'success' && contains(fromJSON('["dev","pre","prod"]'), inputs.branch) }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="$(terraform output -raw frontend_bucket_name)"
          DISTRIBUTION_ID="$(terraform output -raw cloudfront_distribution_id)"
          ENVIRONMENT="${{ inputs.branch }}"

          if [[ -z "$BUCKET" || "$BUCKET" == "null" ]]; then
            echo "::error::Terraform output frontend_bucket_name is empty."
            exit 1
          fi
          if [[ -z "$DISTRIBUTION_ID" || "$DISTRIBUTION_ID" == "null" ]]; then
            echo "::error::Terraform output cloudfront_distribution_id is empty."
            exit 1
          fi

          # Verify these outputs point to existing AWS resources before publishing secrets.
          aws s3api head-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          ACTUAL_DISTRIBUTION_ID="$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.Id' \
            --output text)"

          if [[ "$ACTUAL_DISTRIBUTION_ID" != "$DISTRIBUTION_ID" ]]; then
            echo "::error::CloudFront distribution validation failed."
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Frontend resources validated for environment '$ENVIRONMENT'."
          echo "S3 bucket and distribution IDs are intentionally not printed."

      - name: Configure frontend GitHub Environment secrets
        if: ${{ steps.frontend-resources.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          FRONTEND_REPO: AryA281004/neon-lens-frontend
          TARGET_ENVIRONMENT: ${{ steps.frontend-resources.outputs.environment }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing from terraform-infra repository secrets."
            exit 1
          fi

          BUCKET="$(terraform output -raw frontend_bucket_name)"
          DISTRIBUTION_ID="$(terraform output -raw cloudfront_distribution_id)"

          # Ensure the environment exists before attempting to write its environment secrets.
          gh api --method PUT \
            "repos/${FRONTEND_REPO}/environments/${TARGET_ENVIRONMENT}" \
            --silent

          printf '%s' "$BUCKET" |
            gh secret set FRONTEND_BUCKET_NAME \
              --repo "$FRONTEND_REPO" \
              --env "$TARGET_ENVIRONMENT"

          printf '%s' "$DISTRIBUTION_ID" |
            gh secret set CLOUDFRONT_DISTRIBUTION_ID \
              --repo "$FRONTEND_REPO" \
              --env "$TARGET_ENVIRONMENT"

          echo "Updated frontend destination secrets for environment '$TARGET_ENVIRONMENT'."

      - name: Trigger matching frontend build and deployment
        if: ${{ steps.frontend-resources.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          FRONTEND_REPO: AryA281004/neon-lens-frontend
          TARGET_ENVIRONMENT: ${{ steps.frontend-resources.outputs.environment }}
        run: |
          set -euo pipefail

          gh workflow run frontend-build.yml \
            --repo "$FRONTEND_REPO" \
            --ref "$TARGET_ENVIRONMENT"

          echo "Dispatched frontend build for '$TARGET_ENVIRONMENT'."
          echo "The frontend deployment workflow will deploy only after that build succeeds."


      # ----------------------------------------------------------
      # Slack notification
      # ----------------------------------------------------------

      
      - name: Send Terraform apply result to Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_APPLY_URL }}
          APPLY_OUTCOME: ${{ steps.terraform-apply.outcome }}
          SELECTED_BRANCH: ${{ inputs.branch }}
          SELECTED_ENVIRONMENT: ${{ inputs.environment || inputs.branch }}
          SELECTED_REGION: ${{ env.AWS_REGION }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.plan_run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          # ---------------------------------------------------------
          # Configuration and workflow metadata
          # ---------------------------------------------------------

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          outcome = os.environ.get("APPLY_OUTCOME", "unknown").lower()
          branch = os.environ.get("SELECTED_BRANCH", "unknown")
          environment = os.environ.get("SELECTED_ENVIRONMENT", "unknown")
          region = os.environ.get("SELECTED_REGION", "unknown")
          plan_run_id = os.environ.get("PLAN_RUN_ID", "").strip()
          run_url = os.environ["RUN_URL"]
          plan_run_url = os.environ["PLAN_RUN_URL"]
          commit_url = os.environ["COMMIT_URL"]
          repository = os.environ["REPOSITORY"]
          commit_sha = os.environ.get("COMMIT_SHA", "")[:7] or "unknown"
          actor = os.environ.get("ACTOR", "unknown")
          workflow_name = os.environ.get("WORKFLOW_NAME", "Terraform Apply")
          run_number = os.environ.get("RUN_NUMBER", "unknown")
          run_attempt = os.environ.get("RUN_ATTEMPT", "1")
          event_name = os.environ.get("EVENT_NAME", "unknown")

          if not webhook:
              print(
                  "SLACK_WEBHOOK_APPLY_URL is empty or unavailable.",
                  file=sys.stderr
              )
              sys.exit(1)

          # ---------------------------------------------------------
          # Status presentation
          # ---------------------------------------------------------

          statuses = {
              "success": {
                  "emoji": "🚀",
                  "label": "APPLY SUCCEEDED",
                  "color": "#2EB886",
                  "summary": (
                      "Terraform apply completed successfully. "
                      "Review the workflow logs for the execution details."
                  ),
                  "icon": ":white_check_mark:"
              },
              "failure": {
                  "emoji": "🚨",
                  "label": "APPLY FAILED",
                  "color": "#E01E5A",
                  "summary": (
                      "Terraform apply failed. Open the apply workflow "
                      "to identify the failing step and review its logs."
                  ),
                  "icon": ":x:"
              },
              "cancelled": {
                  "emoji": "🛑",
                  "label": "APPLY CANCELLED",
                  "color": "#E0A12F",
                  "summary": (
                      "The apply step was cancelled. Verify the resulting "
                      "infrastructure state before retrying."
                  ),
                  "icon": ":octagonal_sign:"
              },
              "skipped": {
                  "emoji": "⏭️",
                  "label": "APPLY SKIPPED",
                  "color": "#808B98",
                  "summary": (
                      "The apply step did not run. Check workflow conditions, "
                      "approvals, and prerequisite steps."
                  ),
                  "icon": ":fast_forward:"
              }
          }

          status_info = statuses.get(outcome, {
              "emoji": "⚠️",
              "label": f"APPLY STATUS: {outcome.upper()}",
              "color": "#E0A12F",
              "summary": (
                  "The apply step returned an unrecognized outcome. "
                  "Inspect the workflow run to confirm what happened."
              ),
              "icon": ":warning:"
          })

          # ---------------------------------------------------------
          # Formatting helpers
          # ---------------------------------------------------------

          def safe(value):
              """Prevent Slack mrkdwn control characters in metadata."""
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )

          def field(label, value):
              return {
                  "type": "mrkdwn",
                  "text": f"*{label}*\n{safe(value)}"
              }

          timestamp = datetime.now(timezone.utc).strftime(
              "%d %b %Y, %H:%M UTC"
          )

          # ---------------------------------------------------------
          # Deployment context
          # ---------------------------------------------------------

          if plan_run_id:
              plan_reference = (
                  f"<{plan_run_url}|View plan run #{safe(plan_run_id)}>"
              )
              plan_description = (
                  f"The apply is associated with plan workflow run "
                  f"#{safe(plan_run_id)}. Check the apply workflow to verify "
                  "that the intended saved plan artifact was used."
              )
          else:
              plan_reference = "_No plan run ID supplied_"
              plan_description = (
                  "No plan run ID was supplied. Verify which plan was used "
                  "before treating this deployment as fully traceable."
              )

          fields = [
              field("Environment", f"`{environment}`"),
              field("AWS Region", f"`{region}`"),
              field("Branch", f"`{branch}`"),
              field("Repository", f"`{repository}`"),
              field("Commit", f"<{commit_url}|`{commit_sha}`>"),
              field("Triggered By", f"`{actor}`"),
              field("Workflow Run", f"#{run_number} · Attempt {run_attempt}"),
              field("Trigger Event", f"`{event_name}`")
          ]

          # ---------------------------------------------------------
          # Slack Block Kit message
          # ---------------------------------------------------------

          blocks = [
              {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": (
                          f"{status_info['emoji']} Terraform "
                          f"{status_info['label']}"
                      ),
                      "emoji": True
                  }
              },
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": (
                          f"{status_info['icon']}  *Deployment status*\n"
                          f"{status_info['summary']}"
                      )
                  }
              },
              {"type": "divider"},
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*DEPLOYMENT DETAILS*"
                  },
                  "fields": fields
              },
              {"type": "divider"},
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": (
                          "*PLAN TRACEABILITY*\n"
                          f"{plan_reference}\n"
                          f"{plan_description}"
                      )
                  }
              },
              {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": (
                              f"Workflow: *{safe(workflow_name)}*  •  "
                              f"Run: `#{safe(run_number)}`  •  "
                              f"Reported: {timestamp}"
                          )
                      }
                  ]
              },
              {
                  "type": "actions",
                  "elements": [
                      {
                          "type": "button",
                          "text": {
                              "type": "plain_text",
                              "text": "View Apply Run",
                              "emoji": True
                          },
                          "style": (
                              "primary"
                              if outcome == "success"
                              else "danger"
                              if outcome == "failure"
                              else None
                          ),
                          "url": run_url,
                          "action_id": "view_apply_run"
                      },
                      {
                          "type": "button",
                          "text": {
                              "type": "plain_text",
                              "text": "View Commit",
                              "emoji": True
                          },
                          "url": commit_url,
                          "action_id": "view_commit"
                      }
                  ]
              }
          ]

          # Slack does not accept a null button style. Remove it for
          # outcomes that do not have a dedicated button style.
          for block in blocks:
              if block.get("type") == "actions":
                  for element in block["elements"]:
                      if element.get("style") is None:
                          element.pop("style", None)

          if plan_run_id:
              blocks[-1]["elements"].append({
                  "type": "button",
                  "text": {
                      "type": "plain_text",
                      "text": "View Plan Run",
                      "emoji": True
                  },
                  "url": plan_run_url,
                  "action_id": "view_plan_run"
              })

          payload = {
              "text": (
                  f"{status_info['emoji']} Terraform "
                  f"{status_info['label']} | "
                  f"{repository} | {environment} | {branch}"
              ),
              "attachments": [
                  {
                      "color": status_info["color"],
                      "blocks": blocks
                  }
              ]
          }

          # ---------------------------------------------------------
          # Deliver notification and fail visibly if Slack rejects it
          # ---------------------------------------------------------

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  response_body = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  if not 200 <= response.status < 300:
                      raise RuntimeError(
                          f"Slack rejected the notification: "
                          f"HTTP {response.status}: {response_body}"
                      )

                  if response_body.strip().lower() != "ok":
                      print(
                          "Warning: Slack returned an unexpected response: "
                          f"{response_body}"
                      )
                  else:
                      print(
                          "Slack notification delivered successfully."
                      )

                  print(f"Apply outcome: {outcome}")
                  print(f"Environment: {environment}")
                  print(f"Workflow run: {run_url}")

          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(
                  f"Slack HTTP error {error.code}: {body}",
                  file=sys.stderr
              )
              raise

          except (urllib.error.URLError, TimeoutError) as error:
              print(
                  f"Unable to deliver Slack notification: {error}",
                  file=sys.stderr
              )
              raise
          PY
