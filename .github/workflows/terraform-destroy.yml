name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select the environment to DESTROY"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod
          - main
        default: dev
      confirm:
        description: "Type destroy-<env> to confirm (example: destroy-dev)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Never cancel a destroy halfway; it can leave the state locked
# and resources half-deleted.
concurrency:
  group: terraform-destroy-${{ inputs.branch }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-destroy:
    name: Terraform Destroy - ${{ inputs.branch }}
    runs-on: ubuntu-latest

    # Add "Required reviewers" on each GitHub Environment
    # (Settings -> Environments) to get a manual approval gate.
    environment: ${{ inputs.branch }}

    steps:
      # ---------------------------------------------------------
      # Safety: confirmation text must match exactly
      # ---------------------------------------------------------
      - name: Validate confirmation
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -e

          EXPECTED="destroy-${BRANCH}"

          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "Confirmation failed."
            echo "Expected: $EXPECTED"
            echo "Received: $CONFIRM"
            exit 1
          fi

          echo "Confirmation OK for environment: $BRANCH"

      # ---------------------------------------------------------
      # Checkout selected branch
      # ---------------------------------------------------------
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ---------------------------------------------------------
      # Set Terraform variables
      # ---------------------------------------------------------
      - name: Set Terraform variables
        shell: bash
        run: |
          set -e

          echo "TF_VAR_environment=${{ inputs.branch }}" >> "$GITHUB_ENV"

          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "VAR_FILES=-var-file=terraform.tfvars" >> "$GITHUB_ENV"
          else
            echo "VAR_FILES=-var-file=terraform.tfvars -var-file=environments/${{ inputs.branch }}.tfvars" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------
      # Select AWS region based on environment
      # ---------------------------------------------------------
      - name: Set AWS region
        shell: bash
        run: |
          set -e

          case "${{ inputs.branch }}" in
            dev)
              echo "AWS_REGION=eu-west-1" >> "$GITHUB_ENV"
              ;;
            pre)
              echo "AWS_REGION=us-east-2" >> "$GITHUB_ENV"
              ;;
            prod | main)
              echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown branch: ${{ inputs.branch }}"
              exit 1
              ;;
          esac

      # ---------------------------------------------------------
      # Setup Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ---------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666729139368:role/github-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformDestroy-${{ inputs.branch }}

      - name: Verify AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # Pass MongoDB Atlas API keys to Terraform
      # ---------------------------------------------------------
      - name: Pass MongoDB Atlas keys to Terraform
        shell: bash
        env:
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        run: |
          set -e
          echo "TF_VAR_mongodb_atlas_public_key=$MONGODB_ATLAS_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_mongodb_atlas_private_key=$MONGODB_ATLAS_PRIVATE_KEY" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -upgrade

      # ---------------------------------------------------------
      # Select Terraform workspace (must already exist)
      # ---------------------------------------------------------
      - name: Select Terraform workspace
        shell: bash
        run: |
          set -e

          WORKSPACE="${{ inputs.branch }}"
          echo "Target Terraform workspace: $WORKSPACE"

          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$WORKSPACE"; then
            terraform workspace select "$WORKSPACE"
          else
            echo "Workspace '$WORKSPACE' does not exist. Nothing to destroy."
            exit 1
          fi

          echo "Current Terraform workspace: $(terraform workspace show)"

      # ---------------------------------------------------------
      # Terraform Validate
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


        
      # ---------------------------------------------------------
      # Create a destroy plan to identify S3 buckets being deleted
      # ---------------------------------------------------------
      - name: Create Terraform destroy plan
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            $VAR_FILES \
            -input=false \
            -no-color \
            -out=destroy-plan.tfplan

          terraform show -json destroy-plan.tfplan > destroy-plan.json

      # ---------------------------------------------------------
      # Identify only S3 buckets scheduled for destruction
      # ---------------------------------------------------------
      - name: Identify S3 buckets to clean
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("destroy-plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          buckets = set()

          for resource in plan.get("resource_changes", []):
              if resource.get("type") != "aws_s3_bucket":
                  continue

              actions = resource.get("change", {}).get("actions", [])

              # Only clean buckets Terraform plans to delete.
              if "delete" not in actions:
                  continue

              before = resource.get("change", {}).get("before") or {}
              bucket = before.get("bucket")

              if bucket:
                  if bucket == "my-remote-infra-bucket-aryan":
                      raise SystemExit(
                          "Refusing to clean the Terraform state bucket."
                      )
                  buckets.add(bucket)

          with open("s3-buckets-to-clean.txt", "w", encoding="utf-8") as f:
              for bucket in sorted(buckets):
                  f.write(bucket + "\n")

          print(f"S3 buckets scheduled for cleanup: {len(buckets)}")
          for bucket in sorted(buckets):
              print(f"  - {bucket}")
          PY

          {
            echo "## S3 Cleanup Targets"
            echo ""
            if [ -s s3-buckets-to-clean.txt ]; then
              cat s3-buckets-to-clean.txt
            else
              echo "No aws_s3_bucket resources are scheduled for deletion."
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      # ---------------------------------------------------------
      # Read the state: list everything Terraform is tracking
      # ---------------------------------------------------------
      - name: List resources in state
        id: state-list
        shell: bash
        run: |
          set -o pipefail

          echo "Terraform workspace: $(terraform workspace show)"

          terraform state list 2>&1 | tee state-resources.txt

          COUNT=$(grep -c . state-resources.txt || true)
          echo "Resources in state: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "State is empty. Nothing to destroy."
            exit 1
          fi

      # ---------------------------------------------------------
      # Install boto3 for version-aware S3 cleanup
      # ---------------------------------------------------------
      - name: Install S3 cleanup dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check boto3

      # ---------------------------------------------------------
      # Empty S3 buckets before Terraform destroys them
      # ---------------------------------------------------------
      - name: "🧹 Inspect & Clean S3 Buckets"
        id: empty-s3-buckets
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║              NEON LENS  |  S3 CLEANUP                    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

          if [ ! -f s3-buckets-to-clean.txt ]; then
            echo "::error title=Cleanup targets missing::s3-buckets-to-clean.txt was not found."
            exit 1
          fi

          if ! python3 -c 'import boto3' >/dev/null 2>&1; then
            echo "::error title=Missing dependency::boto3 is not installed."
            exit 1
          fi

          python3 - <<'PYTHON'
          import os
          import re
          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          STATE_BUCKET = "my-remote-infra-bucket-aryan"
          TARGET_FILE = "s3-buckets-to-clean.txt"
          SUMMARY_FILE = os.environ.get("GITHUB_STEP_SUMMARY")
          OUTPUT_FILE = os.environ.get("GITHUB_OUTPUT")

          def fail(message):
              print(f"\n❌ CLEANUP FAILED: {message}")
              print(f"::error title=S3 cleanup failed::{message}")
              raise SystemExit(1)

          def section(title):
              print("\n" + "━" * 62)
              print(f"  {title}")
              print("━" * 62)

          def output_metrics(bucket_count, already_clean, cleaned,
                            versions_deleted, markers_deleted):
              values = {
                  "bucket_count": bucket_count,
                  "already_clean": already_clean,
                  "cleaned": cleaned,
                  "versions_deleted": versions_deleted,
                  "markers_deleted": markers_deleted,
              }
              if OUTPUT_FILE:
                  with open(OUTPUT_FILE, "a", encoding="utf-8") as out:
                      for key, value in values.items():
                          out.write(f"{key}={value}\n")
              return values

          def write_summary(metrics, bucket_results, no_targets=False):
              if not SUMMARY_FILE:
                  return
              with open(SUMMARY_FILE, "a", encoding="utf-8") as summary:
                  summary.write("\n## 🧹 S3 Pre-Destroy Cleanup\n\n")
                  if no_targets:
                      summary.write("ℹ️ No S3 buckets were scheduled for deletion.\n\n")
                  summary.write("| Metric | Result |\n|---|---:|\n")
                  summary.write(f"| Buckets scheduled | {metrics['bucket_count']} |\n")
                  summary.write(f"| Already clean | {metrics['already_clean']} |\n")
                  summary.write(f"| Cleaned and verified | {metrics['cleaned']} |\n")
                  summary.write(f"| Object versions deleted | {metrics['versions_deleted']} |\n")
                  summary.write(f"| Delete markers deleted | {metrics['markers_deleted']} |\n")
                  if bucket_results:
                      summary.write("\n### Bucket-by-bucket results\n\n")
                      summary.write("| Bucket | Result | Versions deleted | Markers deleted |\n")
                      summary.write("|---|---|---:|---:|\n")
                      for item in bucket_results:
                          summary.write(
                              f"| `{item['bucket']}` | {item['status']} | "
                              f"{item['versions']} | {item['markers']} |\n"
                          )

          # -----------------------------------------------------
          # 1/4 — Validate target list
          # -----------------------------------------------------
          section("🔎 1/4  |  TARGET VALIDATION")
          try:
              with open(TARGET_FILE, encoding="utf-8") as file:
                  buckets = list(dict.fromkeys(
                      line.strip() for line in file if line.strip()
                  ))
          except OSError as exc:
              fail(f"Cannot read {TARGET_FILE}: {exc}")

          # AWS general-purpose S3 bucket naming format (basic validation).
          bucket_pattern = re.compile(r"^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$")
          invalid = [
              bucket for bucket in buckets
              if (
                  not bucket_pattern.fullmatch(bucket)
                  or ".." in bucket
                  or ".-" in bucket
                  or "-." in bucket
                  or re.fullmatch(r"\d+\.\d+\.\d+\.\d+", bucket)
              )
          ]
          if invalid:
              fail(f"Invalid S3 bucket name(s): {', '.join(invalid)}")

          if STATE_BUCKET in buckets:
              fail(
                  f"Safety guard blocked the Terraform state bucket "
                  f"'{STATE_BUCKET}'. It must never be emptied by this workflow."
              )

          if not buckets:
              print("ℹ️  No S3 buckets are scheduled for deletion.")
              print("✅ Nothing needs cleaning; continuing to Terraform destroy.")
              metrics = output_metrics(0, 0, 0, 0, 0)
              write_summary(metrics, [], no_targets=True)
              raise SystemExit(0)

          print(f"✅ Validated {len(buckets)} unique bucket(s).")
          for bucket in buckets:
              print(f"   • {bucket}")

          # -----------------------------------------------------
          # 2/4 — Validate AWS credentials and account
          # -----------------------------------------------------
          section("🔐 2/4  |  AWS AUTHENTICATION")
          try:
              session = boto3.Session()
              if session.get_credentials() is None:
                  fail("No AWS credentials are available to this workflow.")
              identity = session.client("sts").get_caller_identity()
              account_id = identity.get("Account", "unknown")
              print(f"✅ AWS identity verified | Account: {account_id}")
          except (BotoCoreError, ClientError) as exc:
              fail(f"Could not validate AWS credentials: {exc}")

          # -----------------------------------------------------
          # 3/4 — Inspect and clean only planned buckets
          # -----------------------------------------------------
          section("🧹 3/4  |  BUCKET INSPECTION & CLEANUP")
          already_clean = 0
          cleaned = 0
          versions_deleted_total = 0
          markers_deleted_total = 0
          results = []

          for index, bucket in enumerate(buckets, start=1):
              print("\n" + "─" * 62)
              print(f"📦 BUCKET {index}/{len(buckets)}  |  {bucket}")
              print("─" * 62)
              try:
                  default_s3 = session.client("s3")
                  location = default_s3.get_bucket_location(
                      Bucket=bucket
                  ).get("LocationConstraint")
                  region = location or "us-east-1"
                  s3 = session.client("s3", region_name=region)
                  print(f"🌍 Region: {region}")

                  first_page = s3.list_object_versions(Bucket=bucket, MaxKeys=1)
                  if (
                      not first_page.get("Versions")
                      and not first_page.get("DeleteMarkers")
                  ):
                      print("🟢 STATUS: ALREADY CLEAN — no versions or delete markers found.")
                      already_clean += 1
                      results.append({
                          "bucket": bucket, "status": "🟢 Already clean",
                          "versions": 0, "markers": 0,
                      })
                      continue

                  print("🟡 STATUS: CLEANUP REQUIRED")
                  print("   Removing all object versions and delete markers...")
                  key_marker = None
                  version_marker = None
                  deleted_versions = 0
                  deleted_markers = 0

                  while True:
                      params = {"Bucket": bucket, "MaxKeys": 1000}
                      if key_marker is not None:
                          params["KeyMarker"] = key_marker
                      if version_marker is not None:
                          params["VersionIdMarker"] = version_marker

                      page = s3.list_object_versions(**params)
                      versions = page.get("Versions", [])
                      markers = page.get("DeleteMarkers", [])
                      objects = [
                          {"Key": item["Key"], "VersionId": item["VersionId"]}
                          for item in versions + markers
                      ]

                      if objects:
                          response = s3.delete_objects(
                              Bucket=bucket,
                              Delete={"Objects": objects, "Quiet": False},
                          )
                          errors = response.get("Errors", [])
                          if errors:
                              for error in errors:
                                  print(
                                      f"❌ Delete error | key={error.get('Key')!r} | "
                                      f"version={error.get('VersionId')!r} | "
                                      f"{error.get('Code')}: {error.get('Message')}"
                                  )
                              fail(f"One or more deletions failed for '{bucket}'.")

                          deleted_versions += len(versions)
                          deleted_markers += len(markers)
                          print(
                              f"   ✓ Batch processed | versions: {deleted_versions} | "
                              f"delete markers: {deleted_markers}"
                          )

                      if not page.get("IsTruncated", False):
                          break

                      next_key = page.get("NextKeyMarker")
                      next_version = page.get("NextVersionIdMarker")
                      if next_key == key_marker and next_version == version_marker:
                          fail(f"Pagination stopped advancing for '{bucket}'.")
                      key_marker = next_key
                      version_marker = next_version

                  # Confirm no object versions or delete markers remain.
                  remaining = s3.list_object_versions(Bucket=bucket, MaxKeys=1)
                  if remaining.get("Versions") or remaining.get("DeleteMarkers"):
                      fail(f"Final verification failed: '{bucket}' is not empty.")

                  print("✅ STATUS: CLEANUP VERIFIED")
                  print(f"   Object versions deleted : {deleted_versions}")
                  print(f"   Delete markers deleted  : {deleted_markers}")
                  cleaned += 1
                  versions_deleted_total += deleted_versions
                  markers_deleted_total += deleted_markers
                  results.append({
                      "bucket": bucket, "status": "✅ Cleaned & verified",
                      "versions": deleted_versions, "markers": deleted_markers,
                  })

              except (BotoCoreError, ClientError) as exc:
                  fail(f"AWS operation failed for bucket '{bucket}': {exc}")

          # -----------------------------------------------------
          # 4/4 — Summary, workflow outputs, and job summary
          # -----------------------------------------------------
          section("📊 4/4  |  CLEANUP SUMMARY")
          print(f"  Buckets scheduled         : {len(buckets)}")
          print(f"  Already clean             : {already_clean}")
          print(f"  Cleaned & verified        : {cleaned}")
          print(f"  Object versions deleted   : {versions_deleted_total}")
          print(f"  Delete markers deleted    : {markers_deleted_total}")
          print("━" * 62)
          print("✅ ALL TARGETED BUCKETS PASSED CLEANUP VERIFICATION")
          print("🚀 Terraform destroy may proceed.")

          metrics = output_metrics(
              len(buckets), already_clean, cleaned,
              versions_deleted_total, markers_deleted_total
          )
          write_summary(metrics, results)
          PYTHON

      - name: Add state summary
        if: always()
        run: |
          {
            echo "## Terraform Destroy"
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo "**Environment:** \`${{ inputs.branch }}\`"
            echo "**AWS Region:** \`${AWS_REGION}\`"
            echo "**Commit:** \`$(git rev-parse HEAD)\`"
            echo ""
            echo "### Resources in state (will be destroyed)"
            echo ""
            echo '```text'

            if [ -f state-resources.txt ]; then
              head -c 60000 state-resources.txt
            fi

            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload state resource list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-resources-${{ inputs.branch }}-${{ github.run_id }}
          path: state-resources.txt
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------
      # Terraform Destroy (driven by the state)
      # ---------------------------------------------------------
      - name: Terraform Destroy
        id: terraform-destroy
        shell: bash
        run: |
          set -o pipefail

          terraform destroy \
            -auto-approve \
            $VAR_FILES \
            -input=false \
            -no-color \
            2>&1 | tee destroy-output.txt

      - name: Upload destroy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-log-${{ inputs.branch }}-${{ github.run_id }}
          path: destroy-output.txt
          if-no-files-found: ignore
          retention-days: 7


           # ---------------------------------------------------------
      # Slack notification: destroy + S3 cleanup
      # ---------------------------------------------------------
      - name: "📣 Send Infrastructure Report to Slack"
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DESTROY_URL }}
          STATE_OUTCOME: ${{ steps.state-list.outcome }}
          STATE_RESOURCE_COUNT: ${{ steps.state-list.outputs.resource_count }}
          S3_CLEANUP_OUTCOME: ${{ steps.empty-s3-buckets.outcome }}
          DESTROY_OUTCOME: ${{ steps.terraform-destroy.outcome }}
          S3_BUCKET_COUNT: ${{ steps.empty-s3-buckets.outputs.bucket_count }}
          S3_ALREADY_CLEAN: ${{ steps.empty-s3-buckets.outputs.already_clean }}
          S3_CLEANED: ${{ steps.empty-s3-buckets.outputs.cleaned }}
          S3_VERSIONS_DELETED: ${{ steps.empty-s3-buckets.outputs.versions_deleted }}
          S3_MARKERS_DELETED: ${{ steps.empty-s3-buckets.outputs.markers_deleted }}
          SELECTED_BRANCH: ${{ inputs.branch }}
          SELECTED_REGION: ${{ env.AWS_REGION }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          state_outcome = os.environ.get("STATE_OUTCOME") or "unknown"
          cleanup_outcome = os.environ.get("S3_CLEANUP_OUTCOME") or "unknown"
          destroy_outcome = os.environ.get("DESTROY_OUTCOME") or "unknown"
          branch = os.environ.get("SELECTED_BRANCH", "unknown")
          region = os.environ.get("SELECTED_REGION") or "n/a"
          run_url = os.environ["RUN_URL"]
          commit_url = os.environ["COMMIT_URL"]
          repository = os.environ["REPOSITORY"]
          commit_sha = os.environ["COMMIT_SHA"][:7]
          actor = os.environ["ACTOR"]
          run_number = os.environ.get("RUN_NUMBER", "?")
          run_attempt = os.environ.get("RUN_ATTEMPT", "1")

          state_resource_count = os.environ.get("STATE_RESOURCE_COUNT", "").strip()
          bucket_count = os.environ.get("S3_BUCKET_COUNT") or "0"
          already_clean = os.environ.get("S3_ALREADY_CLEAN") or "0"
          cleaned = os.environ.get("S3_CLEANED") or "0"
          versions_deleted = os.environ.get("S3_VERSIONS_DELETED") or "0"
          markers_deleted = os.environ.get("S3_MARKERS_DELETED") or "0"

          if not webhook:
              print("SLACK_WEBHOOK_DESTROY_URL is not configured; Slack notification skipped.")
              raise SystemExit(0)

          def fmt_duration(seconds):
              h, rem = divmod(int(seconds), 3600)
              m, s = divmod(rem, 60)
              if h:
                  return f"{h}h {m}m {s}s"
              if m:
                  return f"{m}m {s}s"
              return f"{s}s"

          started = os.environ.get("DESTROY_STARTED_AT", "")
          duration = fmt_duration(time.time() - int(started)) if started.isdigit() else ""

          nothing_to_destroy = state_resource_count == "0" and state_outcome == "success"

          # Choose the overall outcome with failure causes taking precedence.
          if cleanup_outcome == "failure":
              emoji, color = "🛑", "#E01E5A"
              title = "S3 CLEANUP BLOCKED THE DESTROY"
              summary = (
                  ":no_entry: *Safety gate engaged.* S3 cleanup failed, so "
                  "Terraform destroy should have been skipped. Review the job logs "
                  "before retrying."
              )
          elif state_outcome == "failure":
              emoji, color = "🚫", "#E01E5A"
              title = "DESTROY ABORTED — STATE CHECK FAILED"
              summary = (
                  ":warning: Terraform state could not be validated or was empty. "
                  "No successful destroy should be assumed; inspect the workflow run."
              )
          elif destroy_outcome == "failure":
              emoji, color = "🚨", "#E01E5A"
              title = "TERRAFORM DESTROY FAILED"
              summary = (
                  ":rotating_light: Terraform destroy failed. Depending on the error, "
                  "some resources may already have been removed. Check the run and "
                  "destroy log before taking further action."
              )
          elif nothing_to_destroy:
              emoji, color = "ℹ️", "#ECB22E"
              title = "NOTHING TO DESTROY"
              summary = (
                  f":information_source: The *{branch}* state has no tracked resources, "
                  "so there was nothing to tear down."
              )
          elif destroy_outcome == "success":
              emoji, color = "✅", "#2EB886"
              title = "INFRASTRUCTURE DESTROY COMPLETED"
              summary = (
                  ":white_check_mark: *Terraform destroy completed successfully.* "
                  "The selected environment's planned S3 buckets were checked before "
                  "destruction."
              )
          else:
              emoji, color = "⚠️", "#ECB22E"
              title = "DESTROY NOT COMPLETED"
              summary = (
                  ":warning: The destroy operation was skipped, cancelled, or did not "
                  "reach a final success state. Check the workflow run for the cause."
              )

          def status(value):
              labels = {
                  "success": "🟢 Success",
                  "failure": "🔴 Failed",
                  "cancelled": "⚪ Cancelled",
                  "skipped": "⏭️ Skipped / not reached",
                  "unknown": "⚪ Not reached",
              }
              return labels.get(value, f"⚪ {value}")

          if cleanup_outcome == "success":
              if bucket_count == "0":
                  cleanup_detail = "ℹ️ No buckets scheduled for cleanup"
              else:
                  cleanup_detail = (
                      f"🪣 *{bucket_count}* bucket(s) inspected\n"
                      f"🟢 *{already_clean}* already clean  ·  "
                      f"✅ *{cleaned}* cleaned & verified\n"
                      f"🗂️ *{versions_deleted}* versions deleted  ·  "
                      f"🏷️ *{markers_deleted}* delete markers removed"
                  )
          elif cleanup_outcome == "failure":
              cleanup_detail = "🔴 Cleanup failed — see workflow logs"
          else:
              cleanup_detail = status(cleanup_outcome)

          if nothing_to_destroy:
              destroy_detail = "ℹ️ Not required — zero tracked resources"
          else:
              destroy_detail = status(destroy_outcome)

          context_fields = [
              {"type": "mrkdwn", "text": f"*Environment*\n`{branch}`"},
              {"type": "mrkdwn", "text": f"*AWS Region*\n`{region}`"},
              {"type": "mrkdwn", "text": f"*Repository*\n`{repository}`"},
              {"type": "mrkdwn", "text": f"*Triggered by*\n`{actor}`"},
              {"type": "mrkdwn", "text": f"*Commit*\n<{commit_url}|`{commit_sha}`>"},
              {"type": "mrkdwn", "text": f"*State listing*\n{status(state_outcome)}"},
          ]
          if state_resource_count:
              context_fields.append(
                  {"type": "mrkdwn", "text": f"*Tracked resources*\n`{state_resource_count}`"}
              )
          if duration:
              context_fields.append(
                  {"type": "mrkdwn", "text": f"*Duration*\n`{duration}`"}
              )

          blocks = [
              {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": f"{emoji}  NEON LENS  |  {title}",
                      "emoji": True,
                  },
              },
              {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": summary},
              },
              {"type": "divider"},
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": ":gear: *DEPLOYMENT CONTEXT*",
                  },
                  "fields": context_fields,
              },
              {"type": "divider"},
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": ":broom: *S3 PRE-DESTROY CLEANUP*\n" + cleanup_detail,
                  },
              },
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": ":cloud: *TERRAFORM DESTROY*\n" + destroy_detail,
                  },
              },
              {"type": "divider"},
              {
                  "type": "actions",
                  "elements": [
                      {
                          "type": "button",
                          "text": {"type": "plain_text", "text": "Open Workflow Run", "emoji": True},
                          "url": run_url,
                          "style": "primary",
                      },
                      {
                          "type": "button",
                          "text": {"type": "plain_text", "text": "View Commit", "emoji": True},
                          "url": commit_url,
                      },
                  ],
              },
              {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": (
                              "🎨 *Neon Lens*  ·  Infrastructure Operations  ·  "
                              f"Run #{run_number} (attempt {run_attempt})"
                          ),
                      }
                  ],
              },
          ]

          payload = {
              "text": f"{emoji} Neon Lens | {title} | {repository} | {branch}",
              "attachments": [{"color": color, "blocks": blocks}],
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Slack notification sent successfully (HTTP {response.status}).")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"Slack webhook failed: HTTP {error.code} - {body}")
              raise
          except urllib.error.URLError as error:
              print(f"Could not reach Slack webhook: {error}")
              raise
